[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-radar-mcp"
version = "0.1.0"
description = "Find better tools, faster: a local-first MCP index of curated resources and userscripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3", "requests>=2.31,<3"]

[project.scripts]
resource-radar = "resource_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
